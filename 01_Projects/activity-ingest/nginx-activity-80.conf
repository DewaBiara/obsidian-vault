# activity.rikala.id — webhook penerima screen-time iOS Shortcuts
# Backend: /opt/activity-ingest/server.py (127.0.0.1:8099)
#
# Catatan: host ini IPv4-only (tidak ada IPv6), jangan pakai "listen [::]:80".

server {
    listen 80;
    server_name activity.rikala.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Blok ini akan digantikan certbot saat sertifikat terbit.
    # Sengaja hanya proxy endpoint yang dibutuhkan, bukan seluruh root.
    location = /health {
        proxy_pass http://127.0.0.1:8099/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ingest {
        proxy_pass http://127.0.0.1:8099/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location = /summary {
        proxy_pass http://127.0.0.1:8099/summary;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404;
    }
}
